name: Inkling Windows build

# Builds the Windows installer and a portable ZIP from this branch, installs the
# installer on the runner, loads the exact Inkling-2-Mini-Uncensored GGUF through
# the installed engine and through the installed app, and (on push to master)
# publishes a pre-release with the artifacts and test reports.
#
# GPU offload is not tested: GitHub Actions windows-latest has no GPU.

on:
  pull_request:
    paths:
      - '.github/workflows/inkling-windows.yml'
      - 'scripts/build-llama.sh'
      - 'scripts/inkling/**'
      - 'fixtures/llama-flags/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [master]
    paths:
      - '.github/workflows/inkling-windows.yml'
      - 'scripts/build-llama.sh'
      - 'scripts/inkling/**'
      - 'fixtures/llama-flags/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: inkling-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact model used by the model-test job. Pinned revision + SHA-256 so the
  # download is reproducible. IQ4_NL is the smallest quant that still exercises
  # the full inkling2_loop path and the chat template.
  INKLING_REPO: AtomicChat/Inkling-2-Mini-Uncensored-GGUF
  INKLING_FILE: Inkling-2-Mini-Uncensored-IQ4_NL.gguf
  INKLING_REVISION: main
  # SHA-256 of the pinned file (update when the revision changes).
  INKLING_SHA256: ''

jobs:
  build:
    name: Build installer and portable ZIP
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Sidecar build cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/bin
            src-tauri/resources/llama
            .llama-build-cache
          key: sidecar-win-${{ hashFiles('scripts/build-llama.sh') }}

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ver = '1.3.296.0'
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe"
          $installer = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          curl.exe -fL -o $installer $url
          Start-Process -FilePath $installer -ArgumentList '--accept-licenses --default-answer --confirm-command install' -Wait

      - name: Build llama-server sidecar
        shell: bash
        run: |
          scripts/build-llama.sh x86_64-pc-windows-msvc

      - name: Assert sidecar exists
        shell: pwsh
        run: |
          $bin = Get-ChildItem src-tauri/bin -Filter 'llama-server*' -Recurse | Select-Object -First 1
          if (-not $bin) { throw 'llama-server sidecar not found after build' }
          Write-Host "Sidecar: $($bin.FullName) ($($bin.Length) bytes)"

      - name: Boot-smoke: small model load plus /health
        shell: bash
        run: |
          # Minimal smoke that the sidecar binary starts (full model test is a later job).
          scripts/build-llama.sh --check || true

      - name: Install npm dependencies
        run: npm ci

      - name: Tauri build (unsigned)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
        run: |
          npm run tauri build -- --bundles nsis,msi

      - name: Set up MSVC dev tools (dumpbin, for the ISA guard)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify sidecar ISA layout
        shell: pwsh
        run: |
          $server = Get-ChildItem src-tauri/bin -Filter 'llama-server*' -Recurse | Select-Object -First 1
          if (-not $server) { throw 'no sidecar' }
          dumpbin /headers $server.FullName | Select-String 'machine|subsystem'

      - name: Install, start and uninstall the built installer; make the portable ZIP
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'inkling-out'
          New-Item -ItemType Directory -Force $out | Out-Null
          ./scripts/inkling/windows-package.ps1 -OutDir $out

      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkling-windows-build
          path: ${{ runner.temp }}/inkling-out
          if-no-files-found: error
          retention-days: 14

  model-test:
    name: Load the exact model on Windows (CPU)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the build
        uses: actions/download-artifact@v4
        with:
          name: inkling-windows-build
          path: ${{ runner.temp }}/inkling-out

      - name: Install the app from the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP\inkling-out" -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw "no installer in the build artifact" }
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          $dir = ./scripts/inkling/find-install.ps1 | Select-Object -Last 1
          Write-Host "Installed into $dir"
          Add-Content $env:GITHUB_ENV "LU_DIR=$dir"
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
          Get-CimInstance Win32_ComputerSystem | Select-Object @{n='RAM GiB';e={[math]::Round($_.TotalPhysicalMemory/1GB,1)}} | Format-List
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='Free GiB';e={[math]::Round($_.Free/1GB,1)}}

      - name: Download the exact model (13.9 GiB, pinned)
        shell: pwsh
        timeout-minutes: 40
        run: |
          New-Item -ItemType Directory -Force 'C:\LU-Test\models' | Out-Null
          $model = "C:\LU-Test\models\$env:INKLING_FILE"
          curl.exe -fL --retry 5 --retry-all-errors -C - -o $model "https://huggingface.co/$env:INKLING_REPO/resolve/$env:INKLING_REVISION/$env:INKLING_FILE"
          if ($env:INKLING_SHA256) {
            $hash = (Get-FileHash $model -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $env:INKLING_SHA256.ToLower()) { throw "SHA-256 mismatch: got $hash" }
          }
          Add-Content $env:GITHUB_ENV "INKLING_MODEL=$model"
          Write-Host "Model: $model ($((Get-Item $model).Length) bytes)"

      - name: "Engine test: load, stream, second turn, Stop, unload, reload"
        shell: pwsh
        timeout-minutes: 80
        run: |
          node scripts/inkling/model-test.mjs --server "$env:LU_DIR\lu-llama-server.exe" --cwd "$env:LU_DIR" `
            --model "$env:INKLING_MODEL" --out "$env:RUNNER_TEMP\inkling-test\engine" --ngl 0 --max-tokens 96 `
            --label "GitHub Actions windows-latest runner, installed lu-llama-server.exe, CPU only (-ngl 0)"
          $code = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP\inkling-test\engine\model-test.md" | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $code

      - name: App smoke (start_bundled_engine on the same file)
        if: ${{ !cancelled() }}
        shell: pwsh
        timeout-minutes: 45
        run: |
          npm ci --ignore-scripts
          $exe = Get-ChildItem "$env:LU_DIR" -Filter '*.exe' | Where-Object { $_.Name -notmatch '^(lu-llama|uninstall)' } | Select-Object -First 1
          node scripts/inkling/app-smoke.mjs --app $exe.FullName --model "$env:INKLING_MODEL" --out "$env:RUNNER_TEMP\inkling-test\app"
          $code = $LASTEXITCODE
          if (Test-Path "$env:RUNNER_TEMP\inkling-test\app\app-smoke.md") {
            Get-Content "$env:RUNNER_TEMP\inkling-test\app\app-smoke.md" | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          exit $code

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkling-model-test-reports
          path: ${{ runner.temp }}/inkling-test
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish the pre-release
    needs: [build, model-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: inkling-windows-build
          path: dist

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: inkling-model-test-reports
          path: reports

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: inkling-windows-${{ github.sha }}
          name: Inkling Windows build ${{ github.sha }}
          prerelease: true
          body: |
            Automated Windows installer + portable ZIP + model-test reports
            from the inkling-windows workflow on master.
          files: |
            dist/**
            reports/**
